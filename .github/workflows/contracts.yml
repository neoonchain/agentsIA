name: Contracts

# Compiles KairosGuard and runs its tests on a local EVM whenever the contracts change.
on:
  push:
    paths: ['contracts/**', '.github/workflows/contracts.yml']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
