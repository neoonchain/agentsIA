name: Desktop installers

# Builds the macOS (.dmg, universal), Windows (.exe) and Linux (.AppImage, .deb) installers.
# - Every push that touches the app: build and keep the installers as workflow artifacts.
# - Pushes to main (and tags like v0.1.0): also publish them as the latest GitHub Release, under fixed
#   file names, so the website's buttons download them directly:
#   releases/latest/download/Kairos-mac-universal.dmg · Kairos-win-x64.exe · Kairos-linux-x86_64.AppImage
on:
  push:
    branches: ['**']
    tags: ['v*']
    paths: ['desktop/**', 'src/**', 'index.html', 'tour.html', 'assets/**', 'manifest.webmanifest', 'sw.js', '.github/workflows/desktop.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: --mac
          - os: windows-latest
            target: --win
          - os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test the app
        run: npm test
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci
      - name: Build installer
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false' # unsigned until you add signing certificates
        run: npx electron-builder ${{ matrix.target }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: Kairos-${{ matrix.os }}
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.exe
            desktop/dist/*.AppImage
            desktop/dist/*.deb
          if-no-files-found: error

  release:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v0.1.{0}', github.run_number) }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('Kairos 0.1.{0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: dist/*
          generate_release_notes: true
